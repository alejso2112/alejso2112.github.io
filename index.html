<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMPACTA CRM | Revenue Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --brand:#0c62ab; --brand-dark:#094a80; --ink:#0f172a; --muted:#64748b;
      --line:#e2e8f0; --bg:#f1f5f9; --radius:12px;
      --sans: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    *{box-sizing:border-box}
    body{ margin:0; font-family:var(--sans); color:var(--ink); background: var(--bg); line-height:1.5; font-size: 14px; }
    
    /* Layout Utilities */
    .hide { display: none !important; }
    .wrap { max-width:1800px; margin:0 auto; padding:0 24px; }
    .flex-center { display: flex; align-items: center; justify-content: center; height: 100vh; }
    
    /* Auth Screen */
    .auth-box { background: #fff; padding: 40px; border-radius: var(--radius); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .auth-box img { height: 50px; margin-bottom: 20px; }
    .auth-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; }
    
    /* Admin Panel */
    .admin-bar { background: #1e293b; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .admin-tools { background: #fff; padding: 24px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--line); }

    /* Original CSS */
    a{color:var(--brand); text-decoration:none}
    .topbar{ position:sticky; top:0; z-index:50; border-bottom:1px solid var(--line); background:rgba(255,255,255,.98); backdrop-filter:blur(10px); }
    .topbar .inner{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; }
    .brand{display:flex; align-items:center; gap:12px; min-width:260px;}
    .logo{ height:40px; width:auto; flex:0 0 auto; display: block; }
    .brand h1{margin:0; font-size:16px; font-weight:700; color:var(--brand-dark); letter-spacing:-0.01em;}
    .brand p{margin:0; font-size:13px; color:var(--muted)}
    
    .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:8px; border:1px solid rgba(12,98,171,.1); background:var(--brand); color:#fff; font-weight:600; font-size:14px; cursor:pointer; transition:all .15s ease; white-space:nowrap; }
    .btn:hover{background:var(--brand-dark)}
    .btn.secondary{background:#fff; color:var(--ink); border:1px solid var(--line);}
    .btn.secondary:hover{background:#f8fafc; border-color:#cbd5e1}
    .btn.danger{background:#fff; color:#b91c1c; border:1px solid rgba(185,28,28,.2);}
    .btn.danger:hover{background:#fef2f2; border-color:#b91c1c}
    .btn.success{background:#10b981; color:#fff; border-color:#059669;}
    .btn.success:hover{background:#059669;}
    .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end;}

    main{padding:24px 0 48px}
    .card{ background:var(--brand); color: #fff; border:1px solid var(--brand-dark); border-radius:var(--radius); box-shadow: 0 12px 30px -5px rgba(12, 98, 171, 0.25); overflow:hidden; display:flex; flex-direction:column; }
    .card .hd{ padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.15); }
    .card .hd h2{margin:0; font-size:15px; font-weight:700; color:#fff;}
    .card .bd{padding:20px; flex:1;}
    .hint{color:rgba(255,255,255,0.85); font-size:13px; margin:0}
    .divider{height:1px; background:rgba(255,255,255,0.2); margin:20px 0}
    label{display:block; font-size:13px; font-weight:600; color:#fff; margin:0 0 6px; letter-spacing: 0.01em;}

    /* Inputs */
    .row{display:grid; grid-template-columns:1fr 1fr; gap:16px}
    .row.one{grid-template-columns:1fr}
    input, select, textarea{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.4); background:#fff; color:var(--ink); outline:none; font-family:var(--sans); font-size:14px; transition: border-color .15s, box-shadow .15s; }
    input::placeholder, textarea::placeholder { color: #94a3b8; }
    input:focus, select:focus, textarea:focus{ border-color: #fff; box-shadow:0 0 0 3px rgba(255,255,255,0.25); }
    textarea{min-height:90px; resize:vertical}
    .actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:24px}

    /* Chips & KPI */
    .pill{ display:inline-block; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; text-align: center; line-height: 1.2; }
    .pill.stage{background:#e0f2fe; color:#0369a1;}
    .pill.disq{background:#fee2e2; color:#b91c1c;}
    .pill.nurture{background:#fef3c7; color:#b45309;}
    .pill.sold{background:#dcfce7; color:#15803d;}
    
    .kpi{display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;}
    .kpi .box{ border:1px solid var(--line); border-radius:10px; padding:14px; background:#fff; color: var(--ink); }
    .kpi .box .label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
    .kpi .box .value{font-size:22px; font-weight:800; color:var(--ink); margin-top:4px}

    /* Filters & Table */
    .filters{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:24px; padding:16px; background:#fff; border-radius:10px; border:1px solid var(--line); }
    .filters label{ color:var(--muted); margin-bottom: 4px; font-size:12px;} 
    .filters input, .filters select { border-color: var(--line); }
    
    .tablewrap{ border:1px solid var(--line); border-radius:10px; background:#fff; margin-top:20px; color: var(--ink); width: 100%; overflow-x: auto; }
    table{ width:100%; border-collapse:collapse; table-layout: auto; }
    th, td{ padding:14px 12px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; white-space:normal; word-wrap: break-word; }
    th{ position:sticky; top:0; background:#f8fafc; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); letter-spacing: 0.5px; z-index:10; white-space: nowrap; cursor: pointer; user-select: none; }
    tbody tr:nth-child(even) td { background-color: #f8fafc; }
    tbody tr:hover td { background-color: #f1f5f9; }
    td.lead-col { min-width:160px; max-width:240px; font-weight:600; color:var(--brand-dark); line-height: 1.4; }
    .lead-meta {font-weight:400; color:var(--muted); font-size:12px; display:block; margin-top:2px;}
    
    .rowactions{display:flex; gap:6px; align-items:center; justify-content:flex-end}
    .mini{ padding:6px 10px; border-radius:6px; font-size:12px; font-weight:600; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
    .mini:hover{border-color:var(--brand); color:var(--brand);}
    .mini.primary { background:var(--brand); color:#fff; border-color:var(--brand); }

    /* Modals */
    .modal{ position:fixed; inset:0; background:rgba(15,23,42,.7); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:20px; z-index:100; }
    .modal.open{display:flex}
    .modal .panel{ width:min(1200px, 95%); height: 90vh; background:#f8fafc; border-radius:16px; border: 1px solid var(--line); box-shadow:0 30px 60px -12px rgba(0,0,0,0.25); color: var(--ink); display: flex; flex-direction: column; overflow: hidden; }
    .modal .panel .hd{ padding:16px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background: #ffffff; flex: 0 0 auto; }
    .modal .panel .hd h3{margin:0; font-size:16px; font-weight:700; color:var(--brand);}
    
    /* Edit Modal Specific */
    #editModal .panel .hd { background: var(--brand); border-bottom: 1px solid var(--brand-dark); }
    #editModal .panel .hd h3 { color: #fff; }
    #editModal .bd { padding: 24px; overflow-y: auto;}
    #editModal label { color: var(--ink); }

    /* Modal Body Grid */
    .modal .panel .bd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; flex: 1 1 auto; overflow: hidden; }
    .modal-col { padding: 24px; overflow-y: auto; }
    .modal-col.left { border-right: 1px solid var(--line); }
    @media (max-width: 900px) {
      .modal .panel .bd-grid { grid-template-columns: 1fr; overflow-y: auto; }
      .modal-col { overflow-y: visible; }
      .modal-col.left { border-right: none; border-bottom: 1px solid var(--line); }
    }

    .status-bar { padding: 12px 24px; background: #eef2ff; border-bottom: 1px solid var(--line); display: flex; gap: 32px; align-items: center; flex: 0 0 auto; }
    .status-group { display: flex; flex-direction: column;
